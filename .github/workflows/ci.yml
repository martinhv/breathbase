name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel older in-flight runs on the same ref when a new one arrives.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - run: npm ci

      - name: Type-check
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Build
        # Firebase env vars are intentionally left blank in CI — the runtime
        # check inside src/lib/firebase.ts logs an error to the console but
        # doesn't throw at build time, so the bundle still compiles.
        run: npm run build
