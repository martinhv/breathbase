# BreathBase static-site config. The edge Caddy VM terminates TLS and
# proxies HTTP to this container on port 8080.

server {
    listen 8080 default_server;
    listen [::]:8080 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Caddy sits in front and sets X-Forwarded-* / X-Real-IP. Trust them so
    # any logging we add later sees the real client IP, not the proxy.
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;
    # Adjust set_real_ip_from to the Caddy VM's address/subnet in your homelab.
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;

    # Compression — Caddy will not re-compress what's already gzipped.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/manifest+json
        image/svg+xml
        font/woff2;

    # Liveness probe for docker / Caddy upstream checks.
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # Hashed build assets (Vite emits content-hashed filenames under /assets/).
    # Safe to cache aggressively — a new build produces new filenames.
    location ^~ /assets/ {
        access_log off;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Pre-rendered voice clips — content-stable, large, and runtime-cached by
    # the service worker, so let the browser keep them too.
    location ^~ /voice/ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        try_files $uri =404;
    }

    # Service workers MUST NOT be cached by intermediaries — otherwise users
    # get stuck on an old SW that never lets the new build install.
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        expires off;
        try_files $uri =404;
    }
    location = /firebase-messaging-sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        expires off;
        try_files $uri =404;
    }
    location ~ ^/workbox-[^/]+\.js$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires off;
        try_files $uri =404;
    }

    # Manifest + index.html: revalidate every load so a deploy is picked up
    # on the next visit instead of hanging on a cached shell.
    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }
    location = /index.html {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # SPA fallback — any unknown path serves index.html so React Router can
    # handle it client-side. Real static files (favicon, icons, manifest) are
    # matched first by try_files.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
