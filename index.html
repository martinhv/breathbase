<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no"
    />
    <meta name="theme-color" content="#0b1120" />
    <meta
      name="description"
      content="Sough — Foundational breathwork, grounded in science."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />
    <title>Sough</title>
    <script>
      // Apply theme before React paints so we never flash the wrong palette.
      // Mirrors src/lib/theme.ts (see applyTheme there); we duplicate the
      // logic in HTML on purpose so the very first frame is correct.
      (function () {
        try {
          var raw = localStorage.getItem("sough:theme");
          var theme = raw === "light" || raw === "dark" || raw === "auto" ? raw : "auto";
          var dark =
            theme === "dark" ||
            (theme === "auto" &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.classList.toggle("dark", dark);
        } catch (_) {
          document.documentElement.classList.add("dark");
        }
      })();
    </script>
  </head>
  <body class="bg-slate-50 text-slate-900 dark:bg-ink-950 dark:text-slate-100">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
